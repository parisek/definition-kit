# Narrow, README-documented round-trip residuals that Lint\DriftAllowlist
# filters out of Support\StructuralDiff's output before the drift-lint
# decides pass/fail. Every rule matches on an EXACT (prop, expected,
# actual) triple, plus a scope (a field type, root-only, or a closed
# component-slug list) — never a bare prop-name wildcard. The one
# exception is a prop whose value domain is itself closed and enumerated
# here in full (see legacy-boolean-required-*): the enumeration is the
# scope. A hand-edit that changes the same prop to any OTHER value still
# fails: these rules exist to un-flag ALREADY-UNDERSTOOD legacy
# export-era artifacts, not to loosen the comparison generally.
#
# These values were originally sourced from a "Known, documented
# round-trip residuals" README section at static/tools/definition-kit/
# README.md, from when this tool lived inside a consuming project. That
# path does not exist in this repository — the rules below are now the
# source of truth, and each carries its own rationale inline.
#
# `true_false.default_value` is deliberately NOT here — the README says
# that one was fixed at the baseline source (schemas/acf-defaults-
# baseline.yaml), not left as a residual. If it ever reappears as a
# drift-lint failure, that is a real regression, not something to
# allowlist.

rules:
  - id: legacy-image-dimension-sentinel
    kind: value
    props: [min_width, max_width, min_height, max_height, max_size]
    when_type: image
    expected: 0
    actual: ''

  - id: legacy-hide-on-screen
    kind: value
    props: [hide_on_screen]
    root_only: true
    expected: ''
    actual: [[], null, false]

  - id: legacy-show-in-rest
    kind: value
    props: [show_in_rest]
    root_only: true
    expected: 0
    actual: [null, false]

  - id: select-default-value-tie
    kind: value
    props: [default_value]
    when_type: select
    expected: ''
    actual: false

  # Legacy exports carry `required` as a JSON boolean; ACF itself never
  # writes that shape (it is edited as a true_false setting, so ACF stores
  # 0/1 — a census of ACF-authored field groups found 16/16 as int 0, never
  # bool). Since Migration\AcfJsonReader now normalises the boolean instead
  # of parking it in wp:, a definition migrated from such an export
  # generates the canonical int while the committed acf.json still holds the
  # boolean.
  #
  # No scope key here: `required` is boolean-valued, so both canonical pairs
  # are enumerated below in full. That closed enumeration IS the scope — any
  # other value on this prop still surfaces as genuine drift.
  - id: legacy-boolean-required-false
    kind: value
    props: [required]
    expected: 0
    actual: false

  - id: legacy-boolean-required-true
    kind: value
    props: [required]
    expected: 1
    actual: true

  - id: legacy-minimal-export-prop-set
    kind: missing
    props:
      - aria-label
      - conditional_logic
      - wrapper
      - prepend
      - append
      - ajax
      - placeholder
      - rows_per_page
      - create_options
      - save_options
      - parent_repeater
      - hide_on_screen
      - show_in_rest
    components:
      - reference-detail
      - creative-slider
      - funnel-default
      - graph-budget
      - hero-home
      - signpost-team
      - stats-list
      - tool-list
      - tool-marquee
      - ebook
      - contact
      - contact-link
      - article-video-play
      - article-video-loop
      - article-video-related
      - certificate-list
