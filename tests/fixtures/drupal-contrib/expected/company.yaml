name: Company
category: Block
kind: block
fields:
  title:
    type: text
    role: field
    label: Title
  address:
    type: object
    role: field
    label: Address
    required: true
    open: true
    drupal:
      field: field_address
      storage: address
      settings:
        field_overrides:
          givenName:
            override: hidden
          organization:
            override: hidden
          addressLine1:
            override: optional
          locality:
            override: optional
  branches:
    type: list
    role: field
    label: Branches
    open: true
    drupal:
      storage: address
